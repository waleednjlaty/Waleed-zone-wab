name: Disposable PostgreSQL metadata tooling
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/file-metadata.cjs'
      - 'migrations/**'
      - 'package*.json'
      - '.github/workflows/file-metadata.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: wz_metadata_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wz_metadata_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:metadata
        env:
          WZ_METADATA_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/wz_metadata_test_ci
