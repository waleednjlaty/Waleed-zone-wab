name: Upgrade Next.js security baseline

on:
  push:
    branches:
      - seo-security-indexing
    paths:
      - .github/workflows/upgrade-next.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo-security-indexing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Upgrade framework dependencies
        run: |
          npm install --save-exact next@15.5.26 react@19.3.0 react-dom@19.3.0
          npm install --save-dev --save-exact eslint-config-next@15.5.26 @types/react@latest @types/react-dom@latest

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js security baseline to 15.5.26"
          git push origin HEAD:seo-security-indexing
