name: Integration quality and security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: wz_phase2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wz_phase2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WZ_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/wz_phase2_test
      WZ_SEO_FIXTURES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/wz-browser" --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/wz-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "WZ_BROWSER_MODULE=$RUNNER_TEMP/wz-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Production API/security and browser integration
        run: npm run test:integration
        env:
          WZ_BROWSER_TESTS: 'true'
