name: Integration quality and security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/admin-integration]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: wz_phase2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wz_phase2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WZ_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/wz_phase2_test
      WZ_SEO_FIXTURES: 'true'
      FILES_CHANNEL_USERNAME: files_channel
      LEGACY_DOWNLOAD_SIGNING_KEY: ci-fixture-signing-secret-only-never-deploy-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Create disposable download test database
        run: node -e 'const sql=require("postgres")(process.env.WZ_TEST_DATABASE_URL); (async()=>{try{await sql.unsafe("CREATE DATABASE wz_phase3_test");}finally{await sql.end();}})().catch(()=>process.exitCode=1)'
      - name: Create disposable metadata test database
        run: node -e 'const sql=require("postgres")(process.env.WZ_TEST_DATABASE_URL); (async()=>{try{await sql.unsafe("CREATE DATABASE wz_metadata_test_integrated");}finally{await sql.end();}})().catch(()=>process.exitCode=1)'
      - name: Unit and strict download contract tests
        run: npm test
        env:
          WZ_DOWNLOAD_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/wz_phase3_test
          WZ_DOWNLOAD_CONTRACT_STRICT: '1'
          WZ_ADMIN_CONTRACT_STRICT: '1'
          WZ_METADATA_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/wz_metadata_test_integrated
      - name: Strict owner Admin API and real interoperability gates
        run: |
          WZ_ADMIN_CONTRACT_STRICT=1 node --test tests/admin-api.cjs
          node --test tests/admin-interoperability.cjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - run: npm run build
      - name: Scan compiled client assets for private configuration
        run: node scripts/scan-client-secrets.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/wz-browser" --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/wz-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "WZ_BROWSER_MODULE=$RUNNER_TEMP/wz-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Admin UI fixture and accessibility checks
        run: |
          npm install --prefix "$RUNNER_TEMP/wz-browser" --no-audit --no-fund axe-core@4.10.3
          WZ_AXE_MODULE="$RUNNER_TEMP/wz-browser/node_modules/axe-core/axe.min.js" node scripts/test-admin-ui.mjs
      - name: Real owner Admin HTTPS/PostgreSQL browser release gate
        run: |
          node -e 'const sql=require("postgres")(process.env.WZ_TEST_DATABASE_URL); (async()=>{try{await sql.unsafe("CREATE DATABASE wz_admin_test");}finally{await sql.end();}})().catch(()=>process.exitCode=1)'
          node scripts/test-admin-integration.mjs
        env:
          WZ_ADMIN_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/wz_admin_test
      - name: Download UI browser checks
        run: node scripts/test-download-ui.mjs
      - name: Production API/security and browser integration
        run: npm run test:integration
        env:
          WZ_BROWSER_TESTS: 'true'
